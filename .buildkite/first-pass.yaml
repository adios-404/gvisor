# Test pipeline for first-pass (commit as .buildkite/first-pass.yaml on a test
# branch). Two questions:
#
#   (1) Can a first-pass build trigger a build in `pipeline`? The trigger step
#       below tries. If `pipeline` gets a new build titled "(DO NOT MERGE)
#       first-pass -> pipeline trigger test", the answer is yes.
#   (4) Can uploaded steps override the variables the coordinator uses to
#       decide trust (BUILDKITE_PULL_REQUEST, BUILDKITE_SOURCE)? The two
#       override steps try, at pipeline level and at step level, and print what
#       the job actually got. Compare with the values Buildkite reports for each
#       job (check-trigger-test.sh does this).
#
# Override values are deliberately distinctive, so any leak is obvious.

env:
  BUILDKITE_PULL_REQUEST: "424242"
  BUILDKITE_SOURCE: "schedule"
  BUILDKITE_BUILD_ID: "00000000-0000-0000-0000-000000000042"

steps:
  - label: ":mag: env override (pipeline-level env)"
    key: "override-pipeline-env"
    command: >-
      echo "BUILDKITE_PULL_REQUEST=$$BUILDKITE_PULL_REQUEST
      BUILDKITE_SOURCE=$$BUILDKITE_SOURCE BUILDKITE_BUILD_ID=$$BUILDKITE_BUILD_ID"
    agents:
      queue: "default"

  - label: ":mag: env override (step env)"
    key: "override-step-env"
    env:
      BUILDKITE_PULL_REQUEST: "false"
      BUILDKITE_SOURCE: "ui"
      BUILDKITE_BUILD_ID: "00000000-0000-0000-0000-000000000043"
    command: >-
      echo "BUILDKITE_PULL_REQUEST=$$BUILDKITE_PULL_REQUEST
      BUILDKITE_SOURCE=$$BUILDKITE_SOURCE BUILDKITE_BUILD_ID=$$BUILDKITE_BUILD_ID"
    agents:
      queue: "default"

  - label: ":arrow_right: trigger pipeline"
    key: "trigger-pipeline"
    trigger: "pipeline"
    async: true
    build:
      branch: "${BUILDKITE_BRANCH}"
      commit: "${BUILDKITE_COMMIT}"
      message: "(DO NOT MERGE) first-pass -> pipeline trigger test"
