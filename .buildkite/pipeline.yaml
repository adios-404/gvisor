# Harmless pipeline for the trigger test (commit as .buildkite/pipeline.yaml on
# the same test branch). If first-pass can trigger `pipeline`, the triggered
# build uploads this: a single block step, so no job runs on trusted agents
# beyond `pipeline`'s own upload step.
steps:
  - block: ":warning: Triggered from first-pass (trigger test). Do not unblock; cancel this build."
